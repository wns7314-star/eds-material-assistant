name: EDS recovery environment check
on:
  push:
    branches: [css-refresh-20261117]
    paths: [.github/workflows/eds-environment-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify independent build tools
        run: |
          python3 --version
          node --version
          openssl version
          python3 - <<'PY'
          import os, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "eds_probe.txt"
              p.write_text("EDS environment ready", encoding="utf-8")
              assert p.read_text(encoding="utf-8") == "EDS environment ready"
          print("EDS_FILE_WRITE_AND_EXECUTION_OK")
          PY
